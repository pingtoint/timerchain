name: Build Android APK

# 触发方式：推送到 master，或在 GitHub 网页手动 Run workflow
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      # android/ 不提交到仓库，由 prebuild 按 app.json 现场生成
      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK (arm64 only)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: timerchain-arm64-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # 把 APK 同步到 Gitee Release，手机从 Gitee 下载比从 GitHub 快很多
      - name: Publish to Gitee Release
        if: ${{ env.GITEE_TOKEN != '' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          TAG="preview-${GITHUB_RUN_NUMBER}"
          API="https://gitee.com/api/v5/repos/pingtoint/timerchain"
          APK="android/app/build/outputs/apk/release/app-release.apk"

          RESP=$(curl -sS -X POST "$API/releases" \
            -H "Content-Type: application/json" \
            -d "{\"access_token\":\"${GITEE_TOKEN}\",\"tag_name\":\"${TAG}\",\"name\":\"Preview ${TAG}\",\"target_commitish\":\"master\",\"body\":\"Automated build for ${GITHUB_SHA}\"}")

          REL_ID=$(printf '%s' "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("id",""))' 2>/dev/null || echo "")

          if [ -z "$REL_ID" ]; then
            echo "::warning::Gitee release creation failed: $RESP"
            exit 0
          fi

          curl -sS -X POST "$API/releases/${REL_ID}/attach_files" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "file=@${APK}"

          echo "Gitee release: https://gitee.com/pingtoint/timerchain/releases/tag/${TAG}"
